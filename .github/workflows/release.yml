name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build and stage release packages
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/jeffreybergier/altivec-intelligence:latest
    env:
      ALTIVEC_SDK_ARCHIVE_DIR: /sdk-archives
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve release tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag_name }}"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${tag#v}" >> "$GITHUB_ENV"

      - name: Install SDKs
        run: altivec-sdk install

      - name: Build configured targets and stage assets
        run: |
          altivec-release build
          altivec-release stage "$RELEASE_VERSION" --dist dist
          ls -lh dist

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FizzBuzz-release
          path: dist/*
          if-no-files-found: error
